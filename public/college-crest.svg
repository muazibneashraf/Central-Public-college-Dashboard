<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d"/>
      <stop offset="50%" stop-color="#f4b942"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a323d"/>
      <stop offset="100%" stop-color="#03161c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f4b942" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Circular Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="88" fill="#041b22" stroke="rgba(244,185,66,0.4)" stroke-width="1.5"/>

  <!-- Academic Shield Shape -->
  <path d="M 60 52 L 140 52 C 140 52 144 100 100 148 C 56 100 60 52 60 52 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Golden Stars at Top -->
  <!-- Center Star -->
  <polygon points="100,60 103,68 111,68 105,73 107,81 100,76 93,81 95,73 89,68 97,68" fill="#f4b942"/>
  <!-- Left Star -->
  <polygon points="80,66 82,72 88,72 83,76 85,82 80,78 75,82 77,76 72,72 78,72" fill="#fbd38d" transform="scale(0.8) translate(22, 10)"/>
  <!-- Right Star -->
  <polygon points="120,66 122,72 128,72 123,76 125,82 120,78 115,82 117,76 112,72 118,72" fill="#fbd38d" transform="scale(0.8) translate(28, 10)"/>

  <!-- Open Book Symbol of Learning -->
  <path d="M 72 112 C 84 106 96 108 100 114 C 104 108 116 106 128 112 C 128 124 116 120 100 126 C 84 120 72 124 72 112 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 100 114 L 100 126" stroke="#041b22" stroke-width="1.5"/>
  <!-- Book Spine / Lines -->
  <line x1="78" y1="113" x2="94" y2="111" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="78" y1="117" x2="94" y2="115" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="106" y1="111" x2="122" y2="113" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="106" y1="115" x2="122" y2="117" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Torch / Flame of Enlightenment -->
  <path d="M 100 82 C 95 89 97 96 100 100 C 103 96 105 89 100 82 Z" fill="#f59e0b"/>
  <path d="M 100 86 C 98 90 99 94 100 96 C 101 94 102 90 100 86 Z" fill="#fef08a"/>
  <!-- Torch Handle -->
  <line x1="100" y1="100" x2="100" y2="107" stroke="#f4b942" stroke-width="3" stroke-linecap="round"/>

  <!-- Laurel Wreath Leaves on Sides -->
  <g fill="#f4b942" opacity="0.85">
    <!-- Left Laurel Leaves -->
    <path d="M 52 85 C 48 95 56 105 60 112 C 57 106 52 98 52 85 Z"/>
    <path d="M 56 114 C 54 124 64 134 72 142 C 67 135 60 126 56 114 Z"/>
    <path d="M 72 144 C 74 152 86 160 96 166 C 88 160 78 152 72 144 Z"/>

    <!-- Right Laurel Leaves -->
    <path d="M 148 85 C 152 95 144 105 140 112 C 143 106 148 98 148 85 Z"/>
    <path d="M 144 114 C 146 124 136 134 128 142 C 133 135 140 126 144 114 Z"/>
    <path d="M 128 144 C 126 152 114 160 104 166 C 112 160 122 152 128 144 Z"/>
  </g>

  <!-- Bottom Ribbon with College Motto -->
  <path d="M 46 160 Q 100 182 154 160 L 158 174 Q 100 196 42 174 Z" fill="url(#goldGrad)"/>
  <text x="100" y="172" font-family="'Manrope', sans-serif" font-size="8.5" font-weight="900" fill="#041b22" text-anchor="middle" letter-spacing="1.5">EXCELLENCE · INTEGRITY</text>

  <!-- Top Circular Text (Central Public College) -->
  <path id="textArc" d="M 32 100 A 68 68 0 0 1 168 100" fill="none"/>
  <text font-family="'Manrope', sans-serif" font-size="9" font-weight="800" fill="#f4b942" letter-spacing="2.2">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      CENTRAL PUBLIC COLLEGE
    </textPath>
  </text>
</svg>
